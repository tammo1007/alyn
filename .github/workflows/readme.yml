# Rewrites README.md every Monday with the current top 10 and the best skills per category,
# pulled from https://alyn.dev/api/readme.json. Nothing to do by hand.
# Run it now: Actions → "Weekly README" → Run workflow.
name: Weekly README

on:
  schedule:
    - cron: "23 7 * * 1" # Mondays 07:23 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: true

jobs:
  readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build README
        run: node scripts/build-readme.mjs
      - name: Commit
        run: |
          if git diff --quiet README.md; then
            echo "No changes"
            exit 0
          fi
          git config user.name "alyn-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Top AI skills for the week of $(date -u +%Y-%m-%d)"
          git push
